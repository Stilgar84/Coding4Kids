name: Run Tests

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository files onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js and cache dependencies for faster runs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your required Node.js version
          cache: 'npm'

      # Step 3: Install all dependencies listed in package.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the test suite defined in package.json
      - name: Run npm test
        run: npm test
